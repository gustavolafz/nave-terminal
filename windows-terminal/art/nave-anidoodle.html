<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Nave Terminal — Anidoodle Scratchboard + 16_2026 Grainy Flat Illustration</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// =============================================================================
// Nave Terminal Artwork — Hybrid Anidoodle (Scratchboard + 0.25mm Stipple)
//                       + 16_2026 Grainy Flat Illustration (art-paint-music-video)
//
// Weighting per Art Direction:
//   - Planet:     STRONG 16_2026 grainy flat color planes + directional square grain
//                 + source-atop texture over crescent terminator
//   - Atmosphere, Orbital Arcs & Exhaust Cone: MEDIUM directional grainy glow/plume
//   - Spacecraft: SUBTLE flat under-tones + light source-atop grain preserving crisp
//                 3D scratchboard knife-cut engraving!
// =============================================================================

function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0;
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function makeNoise2D(seed) {
  const rng = mulberry32(seed);
  const perm = new Uint8Array(512);
  const base = new Uint8Array(256);
  for (let i = 0; i < 256; i++) base[i] = i;
  for (let i = 255; i > 0; i--) {
    const j = Math.floor(rng() * (i + 1));
    const tmp = base[i]; base[i] = base[j]; base[j] = tmp;
  }
  for (let i = 0; i < 512; i++) perm[i] = base[i & 255];
  const fade = t => t * t * t * (t * (t * 6 - 15) + 10);
  const lerp = (a, b, t) => a + (b - a) * t;
  const hash = (x, y) => perm[(perm[x & 255] + (y & 255)) & 255] / 255;
  return function (x, y) {
    const xi = Math.floor(x), yi = Math.floor(y);
    const xf = x - xi, yf = y - yi;
    const u = fade(xf), v = fade(yf);
    return lerp(
      lerp(hash(xi, yi), hash(xi + 1, yi), u),
      lerp(hash(xi, yi + 1), hash(xi + 1, yi + 1), u),
      v
    );
  };
}

// -----------------------------------------------------------------------------
// 16_2026 Grain Texture Tile (offscreen cached pattern for source-atop overlay)
// Matches 16_2026.md: dark grain specks + bright highlight specks in crisp 1.5-2px squares
// -----------------------------------------------------------------------------
function makeGrainPattern(w, h, darkProb, darkAlpha, lightProb, lightAlpha, seed) {
  const oc = document.createElement('canvas');
  oc.width = w; oc.height = h;
  const octx = oc.getContext('2d');
  const rng = mulberry32(seed);
  const step = 1.5;
  for (let y = 0; y < h; y += step) {
    for (let x = 0; x < w; x += step) {
      const r = rng();
      if (r < darkProb) {
        octx.fillStyle = `rgba(8, 10, 18, ${darkAlpha * (0.6 + 0.4 * rng())})`;
        octx.fillRect(x, y, step, step);
      } else if (r < darkProb + lightProb) {
        octx.fillStyle = rng() < 0.6
          ? `rgba(210, 242, 255, ${lightAlpha * (0.55 + 0.45 * rng())})`
          : `rgba(187, 154, 247, ${lightAlpha * (0.55 + 0.45 * rng())})`;
        octx.fillRect(x, y, step, step);
      }
    }
  }
  return oc;
}

// Physical scratchboard gouge stroke
function gougeStroke(ctx, pts, opts) {
  const {
    color = '#A4E4FF',
    maxWidth = 1.6,
    alpha = 0.9,
    taperStart = 0.25,
    taperEnd = 0.25,
    wobble = 0.20,
    rng,
  } = opts;
  if (pts.length < 2) return;

  const res = [];
  for (let i = 0; i < pts.length - 1; i++) {
    const [x0, y0] = pts[i], [x1, y1] = pts[i + 1];
    const dist = Math.hypot(x1 - x0, y1 - y0);
    const steps = Math.max(2, Math.ceil(dist / 3.5));
    for (let s = 0; s < steps; s++) {
      const u = s / steps;
      const w = (s === 0 && i === 0) ? 0 : wobble;
      res.push([
        x0 + (x1 - x0) * u + (rng ? (rng() - 0.5) * w : 0),
        y0 + (y1 - y0) * u + (rng ? (rng() - 0.5) * w : 0),
      ]);
    }
  }
  res.push(pts[pts.length - 1]);

  const n = res.length;
  const left = [], right = [];
  for (let i = 0; i < n; i++) {
    const u = i / (n - 1);
    let p = 1.0;
    if (taperStart > 0 && u < taperStart) p = Math.min(p, Math.pow(u / taperStart, 0.72));
    if (taperEnd > 0 && u > 1 - taperEnd) p = Math.min(p, Math.pow((1 - u) / taperEnd, 0.72));
    const hw = maxWidth * 0.5 * Math.max(0.02, p);

    const prev = res[Math.max(0, i - 1)];
    const next = res[Math.min(n - 1, i + 1)];
    let dx = next[0] - prev[0], dy = next[1] - prev[1];
    const len = Math.hypot(dx, dy) || 1;
    const nx = -dy / len, ny = dx / len;
    left.push([res[i][0] + nx * hw, res[i][1] + ny * hw]);
    right.push([res[i][0] - nx * hw, res[i][1] - ny * hw]);
  }

  ctx.save();
  ctx.fillStyle = color;
  ctx.globalAlpha = alpha;
  ctx.beginPath();
  ctx.moveTo(left[0][0], left[0][1]);
  for (let i = 1; i < n; i++) ctx.lineTo(left[i][0], left[i][1]);
  for (let i = n - 1; i >= 0; i--) ctx.lineTo(right[i][0], right[i][1]);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

function fillPoly(ctx, pts, color, alpha = 1.0) {
  if (pts.length < 3) return;
  ctx.save();
  ctx.fillStyle = color;
  ctx.globalAlpha = alpha;
  ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

function erasePoly(ctx, pts) {
  if (pts.length < 3) return;
  ctx.save();
  ctx.globalCompositeOperation = 'destination-out';
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

// -----------------------------------------------------------------------------
// Layer 1: Backdrop (Transparent RGBA for Windows Terminal, or #0C0F18 opaque)
// -----------------------------------------------------------------------------
function drawBackdrop(ctx, W, H, planet, rng, transparentBg) {
  ctx.clearRect(0, 0, W, H);
  if (!transparentBg) {
    ctx.fillStyle = '#0C0F18';
    ctx.fillRect(0, 0, W, H);
  }

  // Subtle 16_2026 grainy atmospheric nebula wash radiating softly behind the lit planet limb
  // Built purely from positional-density 1.6px square grain (zero 8-bit gradient banding!)
  const { cx, cy, R } = planet;
  ctx.save();
  for (let i = 0; i < 4800; i++) {
    const deg = 175 + rng() * 112;
    const rad = (deg * Math.PI) / 180;
    const u = Math.pow(rng(), 1.65);
    const dist = R + 3 + u * 125;
    const x = cx + Math.cos(rad) * dist;
    const y = cy + Math.sin(rad) * dist;
    if (x < W * 0.64 || x > W || y < 0 || y > H) continue;

    const arcCenter = Math.cos(((deg - 230) * Math.PI) / 115);
    if (arcCenter <= 0 || rng() > arcCenter) continue;

    const col = u < 0.28 ? '#7DCFFF' : (u < 0.65 ? '#5E82D6' : '#BB9AF7');
    ctx.fillStyle = col;
    ctx.globalAlpha = (1 - u) * 0.24 * arcCenter * (0.5 + 0.5 * rng());
    const sz = u < 0.4 ? 1.2 : 1.45;
    ctx.fillRect(x, y, sz, sz);
  }
  ctx.restore();

  // Calm starfield (tucked gently in right area, ultra-clean left code zone)
  const cell = 44;
  ctx.save();
  for (let gx = 0; gx < W; gx += cell) {
    for (let gy = 0; gy < H; gy += cell) {
      const x = gx + rng() * cell;
      const y = gy + rng() * cell;
      const keepProb = x < W * 0.62 ? 0.03 : 0.18;
      if (rng() > keepProb) continue;

      const bright = Math.pow(rng(), 2.7);
      const r = 0.36 + bright * 0.80;
      ctx.globalAlpha = 0.14 + bright * 0.55;
      ctx.fillStyle = bright > 0.72 ? '#F8FAFC' : (rng() < 0.55 ? '#7DCFFF' : '#BB9AF7');
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  ctx.restore();

  // Two delicate hand-tapered navigational stars tucked cleanly near the corner
  for (const [sx, sy, sz, col] of [
    [W * 0.79, H * 0.46, 5.5, '#A4E4FF'],
    [W * 0.955, H * 0.50, 4.6, '#BB9AF7'],
  ]) {
    gougeStroke(ctx, [[sx - sz, sy], [sx + sz, sy]], { color: col, maxWidth: 1.05, alpha: 0.72, taperStart: 0.45, taperEnd: 0.45, wobble: 0.08, rng });
    gougeStroke(ctx, [[sx, sy - sz], [sx, sy + sz]], { color: col, maxWidth: 1.05, alpha: 0.72, taperStart: 0.45, taperEnd: 0.45, wobble: 0.08, rng });
  }
}

// -----------------------------------------------------------------------------
// Layer 2: PLANET — STRONG 16_2026 Grainy Flat Illustration + 0.25mm Stipple!
// Flat borderless tonal crescent bands (Dribbble Flat) sculpted with dense
// positional-density 1.6-2px square grain stippling + craters + source-atop grain!
// -----------------------------------------------------------------------------
function drawGrainyFlatPlanet(ctx, W, H, dpr, planet, rng, noise, transparentBg) {
  const { cx, cy, R } = planet;
  const lLen = Math.hypot(-0.74, -0.64, 0.21);
  const lx = -0.74 / lLen, ly = -0.64 / lLen, lz = 0.21 / lLen;

  // Erase background stars/halo cleanly inside the sphere silhouette (preserves transparency!)
  if (transparentBg) {
    ctx.save();
    ctx.globalCompositeOperation = 'destination-out';
    ctx.beginPath();
    ctx.arc(cx, cy, R, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  // Render planet on its own offscreen layer so we can apply 16_2026 source-atop grain cleanly!
  const pc = document.createElement('canvas');
  pc.width = Math.round(W * dpr);
  pc.height = Math.round(H * dpr);
  const pctx = pc.getContext('2d');
  pctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  pctx.save();
  pctx.beginPath();
  pctx.arc(cx, cy, R, 0, Math.PI * 2);
  pctx.fillStyle = transparentBg ? 'rgba(13, 17, 32, 0.55)' : '#0D1120';
  pctx.fill();
  pctx.clip();

  // ---- A. 16_2026 BORDERLESS FLAT TONAL PLANES (Obsidian Vibrant: Electric Cyan + Amethyst Violet!) ----
  pctx.fillStyle = '#1E1542';
  pctx.beginPath();
  pctx.arc(cx - R * 0.22, cy - R * 0.20, R * 0.96, 0, Math.PI * 2);
  pctx.fill();

  pctx.fillStyle = '#090A14';
  pctx.beginPath();
  pctx.arc(cx + R * 0.34, cy + R * 0.30, R * 0.94, 0, Math.PI * 2);
  pctx.fill();

  // Zone 2: Vivid cobalt-amethyst mid crescent
  pctx.save();
  pctx.beginPath();
  pctx.arc(cx - R * 0.14, cy - R * 0.12, R * 0.98, 0, Math.PI * 2);
  pctx.clip();
  pctx.fillStyle = '#4B32A8';
  pctx.beginPath();
  pctx.arc(cx - R * 0.34, cy - R * 0.30, R * 0.95, 0, Math.PI * 2);
  pctx.fill();
  pctx.fillStyle = '#1E1542';
  pctx.beginPath();
  pctx.arc(cx + R * 0.14, cy + R * 0.13, R * 0.90, 0, Math.PI * 2);
  pctx.fill();
  pctx.restore();

  // Zone 3: Electric cyan sunlit rim crescent
  pctx.save();
  pctx.beginPath();
  pctx.arc(cx, cy, R, 0, Math.PI * 2);
  pctx.clip();
  pctx.fillStyle = '#00B8FF';
  pctx.beginPath();
  pctx.arc(cx - R * 0.04, cy - R * 0.04, R * 1.0, 0, Math.PI * 2);
  pctx.fill();
  pctx.fillStyle = '#4B32A8';
  pctx.beginPath();
  pctx.arc(cx + R * 0.055, cy + R * 0.050, R * 0.975, 0, Math.PI * 2);
  pctx.fill();
  pctx.fillStyle = '#1E1542';
  pctx.beginPath();
  pctx.arc(cx + R * 0.20, cy + R * 0.18, R * 0.94, 0, Math.PI * 2);
  pctx.fill();
  pctx.fillStyle = '#090A14';
  pctx.beginPath();
  pctx.arc(cx + R * 0.42, cy + R * 0.38, R * 0.94, 0, Math.PI * 2);
  pctx.fill();
  pctx.restore();

  // Flat borderless crater basins (16_2026 style: same-family darker flat crescent inside lighter rim!)
  const craters = [
    { x: -0.56, y: -0.44, rx: 0.145, ry: 0.095, rot: -0.68 },
    { x: -0.32, y: -0.64, rx: 0.105, ry: 0.068, rot: -0.45 },
    { x: -0.71, y: -0.15, rx: 0.115, ry: 0.078, rot: -1.12 },
    { x: -0.17, y: -0.75, rx: 0.078, ry: 0.050, rot: -0.28 },
    { x: -0.44, y: -0.25, rx: 0.088, ry: 0.062, rot: -0.72 },
  ];
  for (const cr of craters) {
    const crx = cx + cr.x * R, cry = cy + cr.y * R;
    const arx = cr.rx * R, ary = cr.ry * R;
    pctx.save();
    pctx.translate(crx, cry);
    pctx.rotate(cr.rot);
    // Flat shaded basin (one step darker indigo-violet)
    pctx.fillStyle = 'rgba(13, 18, 36, 0.56)';
    pctx.beginPath();
    pctx.ellipse(0, 0, arx, ary, 0, 0, Math.PI * 2);
    pctx.fill();
    // Subtle sunlit inner rim highlight on bottom-right interior slope facing upper-left sun
    pctx.beginPath();
    pctx.ellipse(0, 0, arx, ary, 0, 0, Math.PI * 2);
    pctx.clip();
    pctx.fillStyle = 'rgba(125, 207, 255, 0.22)';
    pctx.beginPath();
    pctx.ellipse(arx * 0.28, ary * 0.28, arx * 0.92, ary * 0.92, 0, 0, Math.PI * 2);
    pctx.fill();
    pctx.fillStyle = 'rgba(13, 18, 36, 0.60)';
    pctx.beginPath();
    pctx.ellipse(-arx * 0.16, -ary * 0.16, arx * 0.92, ary * 0.92, 0, 0, Math.PI * 2);
    pctx.fill();
    pctx.restore();
  }

  // ---- B. 16_2026 POSITIONAL-DENSITY SQUARE GRAIN STIPPLE (Dissolves flat cuts into velvety grain!) ----
  const minX = Math.max(0, Math.floor(cx - R));
  const maxX = Math.min(W, Math.ceil(cx + R));
  const minY = Math.max(0, Math.floor(cy - R));
  const maxY = Math.min(H, Math.ceil(cy + R));

  function sphereLight(ux, uy) {
    const d2 = ux * ux + uy * uy;
    if (d2 >= 1.0) return 0;
    const nz = Math.sqrt(1 - d2);
    const ndotl = Math.max(0, ux * lx + uy * ly + nz * lz);
    const rim = Math.pow(1 - nz, 2.5) * Math.pow(Math.max(0, ndotl * 1.7), 0.7);
    const maria = 0.80 + 0.30 * noise(ux * 3.8 + 4.1, uy * 3.8 + 9.2);
    return Math.min(1, Math.max(0, (Math.pow(ndotl, 1.25) * 0.92 + rim * 0.72) * maria));
  }

  // 16_2026-style fine velvety square grain (1.1-1.45px) blending all flat bands organically!
  for (let i = 0; i < 72000; i++) {
    const px = minX + rng() * (maxX - minX);
    const py = minY + rng() * (maxY - minY);
    const ux = (px - cx) / R, uy = (py - cy) / R;
    if (ux * ux + uy * uy >= 0.997) continue;

    const L = sphereLight(ux, uy);
    // 1) Bright cyan/ice fine square grain denser toward sunlit upper-left crescent
    if (L > 0.08 && rng() < Math.pow(L, 1.2) * 0.76) {
      pctx.fillStyle = L > 0.65 ? '#B8FAFF' : (L > 0.34 ? '#00E5FF' : '#C084FC');
      pctx.globalAlpha = 0.16 + L * 0.48;
      const sz = L > 0.5 ? 1.15 : 1.35;
      pctx.fillRect(px, py, sz, sz);
    }
    // 2) Deep obsidian fine square grain biting upward from the night shadow across the terminator!
    const shadowDensity = Math.pow(1 - L, 1.30);
    if (shadowDensity > 0.12 && rng() < shadowDensity * 0.80) {
      pctx.fillStyle = '#0C0F18';
      pctx.globalAlpha = 0.28 + shadowDensity * 0.56;
      pctx.fillRect(px, py, 1.45, 1.45);
    }
  }

  // ---- C. Crisp 0.25mm Anidoodle highlight stipple accents along sunlit crescent ----
  for (let i = 0; i < 8500; i++) {
    const px = minX + rng() * (maxX - minX);
    const py = minY + rng() * (maxY - minY);
    const ux = (px - cx) / R, uy = (py - cy) / R;
    if (ux * ux + uy * uy >= 0.996) continue;
    const L = sphereLight(ux, uy);
    if (L < 0.42 || rng() > Math.pow((L - 0.38) / 0.62, 1.5)) continue;
    pctx.fillStyle = L > 0.74 ? '#E8F8FF' : '#9BE3FF';
    pctx.globalAlpha = 0.28 + L * 0.46;
    pctx.beginPath();
    pctx.arc(px, py, 0.48 + L * 0.26, 0, Math.PI * 2);
    pctx.fill();
  }

  pctx.restore();

  // ---- D. 16_2026 Static Fine Grain Texture Overlay via source-atop (velvety finish on planet!) ----
  const planetGrain = makeGrainPattern(256, 256, 0.085, 0.34, 0.045, 0.22, 162026);
  pctx.save();
  pctx.globalCompositeOperation = 'source-atop';
  pctx.fillStyle = pctx.createPattern(planetGrain, 'repeat');
  pctx.fillRect(minX, minY, maxX - minX, maxY - minY);
  pctx.restore();

  // Composite planet onto main canvas
  ctx.drawImage(pc, 0, 0, W, H);

  // Delicate tapered sunlit rim edge (dissolves smoothly into shadow)
  const limbPts = [];
  for (let deg = 186; deg <= 274; deg += 1.5) {
    const a = (deg * Math.PI) / 180;
    limbPts.push([cx + Math.cos(a) * R, cy + Math.sin(a) * R]);
  }
  gougeStroke(ctx, limbPts, {
    color: '#C6F0FF', maxWidth: 1.65, alpha: 0.80, taperStart: 0.36, taperEnd: 0.42, wobble: 0.16, rng,
  });
}

// -----------------------------------------------------------------------------
// Shared 3D Ship Projection Factory
// -----------------------------------------------------------------------------
function makeShipProjector(scx, scy) {
  const scale = 0.62;
  const roll = -26 * Math.PI / 180;
  const pitch = 22 * Math.PI / 180;
  const yaw2D = -33 * Math.PI / 180;

  function toView(x, y, z) {
    const cr = Math.cos(roll), sr = Math.sin(roll);
    const x1 = x * cr - z * sr;
    const z1 = x * sr + z * cr;
    const cp = Math.cos(pitch), sp = Math.sin(pitch);
    const y2 = y * cp - z1 * sp;
    const z2 = y * sp + z1 * cp;
    const persp = 1.0 / (1.0 - z2 / 1400);
    const sx0 = x1 * scale * persp;
    const sy0 = -y2 * scale * persp;
    const cy2 = Math.cos(yaw2D), sy2 = Math.sin(yaw2D);
    return [scx + sx0 * cy2 - sy0 * sy2, scy + sx0 * sy2 + sy0 * cy2, z2];
  }
  return (x, y, z) => { const v = toView(x, y, z); return [v[0], v[1]]; };
}

// -----------------------------------------------------------------------------
// Layer 3: Planet-Concentric Orbital Chart (Medium-Light Grainy Accent)
// -----------------------------------------------------------------------------
function drawOrbitalChart(ctx, W, H, planet, rng) {
  const { cx, cy, R } = planet;

  const drawConcentricArc = (rOff, deg0, deg1, color, w, alpha, dashed = false, ticks = false) => {
    const r = R + rOff;
    const pts = [];
    for (let d = deg0; d <= deg1; d += 1.2) {
      const a = (d * Math.PI) / 180;
      const x = cx + Math.cos(a) * r, y = cy + Math.sin(a) * r;
      if (x > W * 0.44 && x < W + 20 && y > -20 && y < H + 20) pts.push([x, y]);
    }
    if (pts.length < 2) return;

    if (!dashed) {
      gougeStroke(ctx, pts, { color, maxWidth: w, alpha, taperStart: 0.12, taperEnd: 0.12, wobble: 0.16, rng });
    } else {
      for (let i = 0; i < pts.length - 2; i += 4) {
        gougeStroke(ctx, [pts[i], pts[i + 1], pts[i + 2]], { color, maxWidth: w, alpha, taperStart: 0.2, taperEnd: 0.2, wobble: 0.10, rng });
      }
    }

    // Subtle 16_2026 grainy dust hugging the orbital arc (medium-low weight)
    ctx.save();
    for (let i = 0; i < pts.length; i++) {
      for (let g = 0; g < 3; g++) {
        const jx = (rng() - 0.5) * 14, jy = (rng() - 0.5) * 14;
        ctx.fillStyle = color;
        ctx.globalAlpha = alpha * 0.42 * rng();
        ctx.fillRect(pts[i][0] + jx, pts[i][1] + jy, 1.5, 1.5);
      }
    }
    ctx.restore();

    if (ticks) {
      for (let d = Math.ceil(deg0 / 2) * 2; d <= deg1; d += 2) {
        const a = (d * Math.PI) / 180;
        const x0 = cx + Math.cos(a) * r, y0 = cy + Math.sin(a) * r;
        if (x0 < W * 0.49 || x0 > W - 18 || y0 < 18 || y0 > H - 18) continue;
        const major = d % 10 === 0;
        const tLen = major ? 9 : 4.2;
        gougeStroke(ctx, [[x0, y0], [cx + Math.cos(a) * (r + tLen), cy + Math.sin(a) * (r + tLen)]], {
          color: major ? '#7DCFFF' : '#7AA2F7', maxWidth: major ? 1.05 : 0.65, alpha: major ? 0.42 : 0.22,
          taperStart: 0.1, taperEnd: 0.4, wobble: 0.08, rng,
        });
      }
    }

    for (const endPt of [pts[0], pts[pts.length - 1]]) {
      const a = Math.atan2(endPt[1] - cy, endPt[0] - cx);
      gougeStroke(ctx, [
        [endPt[0] - Math.cos(a) * 5, endPt[1] - Math.sin(a) * 5],
        [endPt[0] + Math.cos(a) * 5, endPt[1] + Math.sin(a) * 5],
      ], { color, maxWidth: 1.0, alpha: alpha * 1.25, taperStart: 0.2, taperEnd: 0.2, wobble: 0.05, rng });
    }
  };

  drawConcentricArc(18, 194, 276, '#7DCFFF', 0.75, 0.26, true, false);
  drawConcentricArc(102, 200, 266, '#7AA2F7', 0.85, 0.28, false, true);
  drawConcentricArc(182, 212, 256, '#BB9AF7', 0.75, 0.24, true, false);
}

// -----------------------------------------------------------------------------
// Layer 4: 3D Aerospace Orbiter — Preserves Crisp Scratchboard Engraving
//          with a SUBTLE touch of 16_2026 flat under-tone + light source-atop grain
//          and a MEDIUM grainy light-cone exhaust plume!
// -----------------------------------------------------------------------------
function drawSpacecraft3D(ctx, W, H, dpr, P, rng, transparentBg) {
  function hullRx(y) {
    if (y >= 132) return 0.5;
    if (y > 40) return 27 * Math.pow((132 - y) / 92, 0.62);
    const u = (40 - y) / 145;
    return 27 + 4.5 * Math.sin(u * Math.PI * 0.75) - 2.5 * u;
  }
  function hullRz(y) {
    if (y >= 132) return 0.5;
    if (y > 40) return 19 * Math.pow((132 - y) / 92, 0.68);
    return 19 - 2.0 * ((40 - y) / 145);
  }
  function hullPt(y, theta) {
    const rx = hullRx(y), rz = hullRz(y);
    const zScale = Math.sin(theta) >= 0 ? rz : rz * 0.48;
    return [rx * Math.cos(theta), y, zScale * Math.sin(theta)];
  }

  const nozzles = [
    { cx: 0, cy: -106, cz: 3.0, r: 10.2, len: 14, plume: 118 },
    { cx: -15.5, cy: -104, cz: -2.2, r: 7.2, len: 11, plume: 82 },
    { cx: 15.5, cy: -104, cz: -2.2, r: 7.2, len: 11, plume: 82 },
  ];

  // ---- A. EXHAUST PLUME (MEDIUM 16_2026 grainy light-cone + Anidoodle thrust flicks!) ----
  for (const nz of nozzles) {
    // 16_2026-style grainy light cone (denser toward center & throat, widening down!)
    const nGrain = nz.r > 9 ? 1150 : 480;
    for (let i = 0; i < nGrain; i++) {
      const u = Math.pow(rng(), 0.72);
      const halfW = nz.r * (0.72 + u * 1.45);
      // Center-biased distribution (like 16_2026 light cone!)
      const lateral = ((rng() + rng()) - 1.0) * halfW;
      const depth = ((rng() + rng()) - 1.0) * halfW * 0.5;
      const [px, py] = P(nz.cx + lateral, nz.cy - nz.len - u * nz.plume * 1.22, nz.cz + depth);
      ctx.save();
      ctx.fillStyle = u < 0.25 ? '#E6F8FF' : (u < 0.60 ? '#7DCFFF' : '#BB9AF7');
      ctx.globalAlpha = (1 - u) * 0.42 * (1 - Math.abs(lateral) / (halfW + 1)) * (0.6 + 0.4 * rng());
      ctx.fillRect(px, py, 1.5, 1.5);
      ctx.restore();
    }

    // Crisp scratchboard thrust flicks bursting out of nozzle throat
    const nFlicks = nz.r > 9 ? 15 : 8;
    for (let i = 0; i < nFlicks; i++) {
      const ang = (i / nFlicks) * Math.PI * 2 + rng() * 0.35;
      const rad = nz.r * (0.18 + 0.56 * rng());
      const ox = nz.cx + Math.cos(ang) * rad, oz = nz.cz + Math.sin(ang) * rad;
      const fLen = nz.plume * (0.28 + 0.62 * Math.pow(rng(), 1.3));
      const spread = 1.0 + fLen * 0.004;
      gougeStroke(ctx, [
        P(ox, nz.cy - nz.len, oz),
        P(ox * spread * 0.9, nz.cy - nz.len - fLen * 0.5, oz * spread),
        P(ox * spread * 1.15, nz.cy - nz.len - fLen, oz * spread),
      ], {
        color: i % 3 === 0 ? '#E2F6FF' : (i % 2 === 0 ? '#7DCFFF' : '#BB9AF7'),
        maxWidth: i % 3 === 0 ? 1.45 : 0.95,
        alpha: 0.28 + 0.46 * (1 - fLen / nz.plume),
        taperStart: 0.08, taperEnd: 0.78, wobble: 0.30, rng,
      });
    }
  }

  // Render spacecraft onto an offscreen layer so we can apply a LIGHT 16_2026 source-atop
  // grain pass exclusively on the craft without touching the crisp outer glow/stars!
  const sc = document.createElement('canvas');
  sc.width = Math.round(W * dpr);
  sc.height = Math.round(H * dpr);
  const sctx = sc.getContext('2d');
  sctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  // ---- B. SYMMETRIC 3D DELTA WINGS ----
  function drawWing(side) {
    const isLit = (side === -1);
    const s = side;
    const zRoot = -5.5, zTip = -1.0;

    const outline3D = [
      [s * 24, 24, zRoot], [s * 42, -4, zRoot + 0.8], [s * 102, -56, zTip],
      [s * 106, -78, zTip], [s * 96, -86, zTip - 0.5], [s * 30, -82, zRoot],
      [s * 27, -100, zRoot], [s * 24, -100, zRoot],
    ];
    // In transparent mode, erase arcs/stars behind wings and leave shadow starboard wing transparent
    const wPts = outline3D.map(q => P(q[0], q[1], q[2]));
    if (transparentBg) {
      erasePoly(ctx, wPts);
      if (isLit) fillPoly(sctx, wPts, '#13203A', 0.85);
    } else {
      fillPoly(sctx, wPts, isLit ? '#13203A' : '#0C0F18');
    }

    const leTop = [[s * 24, 24, zRoot + 2.2], [s * 42, -4, zRoot + 2.6], [s * 102, -56, zTip + 1.8], [s * 106, -78, zTip + 1.4]];
    const leBot = [[s * 24, 24, zRoot - 2.0], [s * 42, -4, zRoot - 1.6], [s * 102, -56, zTip - 1.2], [s * 106, -78, zTip - 1.0]];

    if (isLit) {
      // Subtle 16_2026 flat sunlit wedge near leading edge (gives gentle planar depth under scratch cuts)
      const litStrip = [
        P(s * 25, 22, zRoot + 1.5), P(s * 42, -4, zRoot + 1.8), P(s * 102, -56, zTip + 1.2),
        P(s * 99, -68, zTip + 0.8), P(s * 42, -24, zRoot + 1.0), P(s * 26, 2, zRoot + 1.0),
      ];
      fillPoly(sctx, litStrip, '#244574', 0.34);

      for (let i = 0; i <= 18; i++) {
        const u = i / 18;
        const xSpan = 26 + u * 78;
        const yLead = u < 0.22 ? (22 - (u / 0.22) * 26) : (-4 - ((u - 0.22) / 0.78) * 54);
        const yTrail = -81 - u * 4.5;
        const zSpan = zRoot + u * (zTip - zRoot);
        const bright = Math.pow(1 - u * 0.45, 1.1);
        gougeStroke(sctx, [
          P(s * xSpan, yLead, zSpan + 1.8),
          P(s * xSpan, yLead + (yTrail - yLead) * 0.42, zSpan + 2.4),
          P(s * xSpan, yTrail, zSpan + 0.4),
        ], {
          color: u < 0.38 ? '#D8F3FF' : '#7DCFFF',
          maxWidth: 0.72 + bright * 0.65, alpha: 0.22 + bright * 0.46,
          taperStart: 0.12, taperEnd: 0.42, wobble: 0.14, rng,
        });
      }
      for (let k = 1; k <= 3; k++) {
        const off = k * 4.2;
        gougeStroke(sctx, [
          P(s * 26, 20 - off, zRoot + 2.0),
          P(s * 43, -6 - off, zRoot + 2.2),
          P(s * 101, -58 - off * 0.6, zTip + 1.4),
        ], {
          color: k === 1 ? '#E6F7FF' : '#7DCFFF',
          maxWidth: 1.25 - k * 0.22, alpha: 0.68 - k * 0.15,
          taperStart: 0.12, taperEnd: 0.22, wobble: 0.14, rng,
        });
      }
      gougeStroke(sctx, leTop.map(q => P(q[0], q[1], q[2])), {
        color: '#F0FAFF', maxWidth: 2.2, alpha: 0.96, taperStart: 0.08, taperEnd: 0.15, wobble: 0.16, rng
      });
      gougeStroke(sctx, leBot.map(q => P(q[0], q[1], q[2])), {
        color: '#7DCFFF', maxWidth: 1.0, alpha: 0.54, taperStart: 0.15, taperEnd: 0.2, wobble: 0.14, rng
      });
      gougeStroke(sctx, [P(s * 34, -70, zRoot + 0.5), P(s * 94, -75, zTip + 0.5)], {
        color: '#7DCFFF', maxWidth: 1.05, alpha: 0.62, taperStart: 0.15, taperEnd: 0.15, wobble: 0.12, rng
      });
      gougeStroke(sctx, [P(s * 96, -86, zTip - 0.5), P(s * 30, -82, zRoot)], {
        color: '#7AA2F7', maxWidth: 1.0, alpha: 0.48, taperStart: 0.2, taperEnd: 0.2, wobble: 0.12, rng
      });
    } else {
      for (let i = 0; i < 6; i++) {
        const u = 0.08 + (i / 6) * 0.72;
        const yRoot = 18 - u * 92, yTip = -55 - u * 26;
        gougeStroke(sctx, [P(s * 32, yRoot, zRoot + 1.0), P(s * (72 + rng() * 18), yTip, zTip + 0.6)], {
          color: '#7AA2F7', maxWidth: 0.7, alpha: 0.15 + (1 - u) * 0.16, taperStart: 0.25, taperEnd: 0.5, wobble: 0.14, rng
        });
      }
      gougeStroke(sctx, [P(s * 28, 18, zRoot + 2.0), P(s * 44, -6, zRoot + 2.4), P(s * 97, -53, zTip + 1.6)], {
        color: '#BB9AF7', maxWidth: 1.15, alpha: 0.42, taperStart: 0.18, taperEnd: 0.48, wobble: 0.16, rng
      });
      gougeStroke(sctx, [P(s * 104, -62, zTip + 1.0), P(s * 105, -76, zTip + 0.6)], {
        color: '#BB9AF7', maxWidth: 0.85, alpha: 0.30, taperStart: 0.3, taperEnd: 0.5, wobble: 0.10, rng
      });
    }
  }

  drawWing(1);
  drawWing(-1);

  // ---- C. SCULPTED SCRATCHBOARD FUSELAGE + SUBTLE FLAT UNDERTONE ----
  const portSil = [], spineSil = [], starSil = [];
  for (let y = 132; y >= -104; y -= 6) {
    portSil.push(P(...hullPt(y, Math.PI * 1.04)));
    spineSil.push(P(...hullPt(y, Math.PI * 0.52)));
    starSil.push(P(...hullPt(y, -Math.PI * 0.04)));
  }
  const hullMaskPts = [...portSil, ...starSil.reverse()];
  if (transparentBg) {
    erasePoly(ctx, hullMaskPts);
    fillPoly(sctx, hullMaskPts, '#0C0F18', 0.78);
  } else {
    fillPoly(sctx, hullMaskPts, '#0C0F18');
  }
  // Subtle flat lit-side under-wash on port half of hull (connects craft gently to grainy flat planet!)
  fillPoly(sctx, [...portSil, ...spineSil.slice().reverse()], '#1A3054', 0.42);

  const hullSections = [
    { y0: 131, y1: 100, dens: 10, colA: '#F4FBFF', colB: '#A4E4FF', thStart: 0.96, thEnd: 0.56 },
    { y0: 96,  y1: 35,  dens: 8,  colA: '#E8F7FF', colB: '#7DCFFF', thStart: 0.98, thEnd: 0.64 },
    { y0: 31,  y1: -66, dens: 9,  colA: '#E2F5FF', colB: '#7DCFFF', thStart: 0.98, thEnd: 0.58 },
    { y0: -70, y1: -102,dens: 7,  colA: '#D4F0FF', colB: '#7AA2F7', thStart: 0.96, thEnd: 0.60 },
  ];

  for (const sec of hullSections) {
    for (let s = 0; s < sec.dens; s++) {
      const u = s / (sec.dens - 1);
      const th = Math.PI * (sec.thStart + (sec.thEnd - sec.thStart) * u);
      const peak = Math.exp(-Math.pow((u - 0.32) / 0.34, 2));
      const pts = [];
      for (let y = sec.y0; y >= sec.y1; y -= 5) {
        if (y <= 87 && y >= 37 && th < Math.PI * 0.72) continue;
        pts.push(P(...hullPt(y, th)));
      }
      if (pts.length < 2) continue;
      gougeStroke(sctx, pts, {
        color: peak > 0.65 ? sec.colA : sec.colB,
        maxWidth: 0.85 + peak * 1.45, alpha: 0.24 + peak * 0.70,
        taperStart: 0.14, taperEnd: 0.18, wobble: 0.14, rng,
      });
    }

    const nCross = sec.y0 - sec.y1 > 60 ? 11 : 5;
    for (let k = 0; k < nCross; k++) {
      const jitterY = (rng() - 0.5) * 3.5;
      const y = sec.y0 - 4 - (k / Math.max(1, nCross - 1)) * (sec.y0 - sec.y1 - 8) + jitterY;
      if (y <= 87 && y >= 37) continue;
      const pts = [];
      const endDeg = 52 + rng() * 34;
      for (let deg = 148; deg >= endDeg; deg -= 7) pts.push(P(...hullPt(y, (deg * Math.PI) / 180)));
      if (pts.length < 3) continue;
      gougeStroke(sctx, pts, {
        color: k % 3 === 0 ? '#A4E4FF' : '#7DCFFF',
        maxWidth: 0.75 + rng() * 0.45, alpha: 0.28 + rng() * 0.32,
        taperStart: 0.15, taperEnd: 0.65, wobble: 0.14, rng,
      });
    }
  }

  for (const seamY of [98, 33, -68]) {
    const seamPts = [];
    for (let deg = 175; deg >= 65; deg -= 8) seamPts.push(P(...hullPt(seamY, (deg * Math.PI) / 180)));
    gougeStroke(sctx, seamPts, { color: '#A4E4FF', maxWidth: 1.0, alpha: 0.62, taperStart: 0.15, taperEnd: 0.55, wobble: 0.10, rng });
  }

  const starRim = [];
  for (let y = 130; y >= 46; y -= 6) starRim.push(P(...hullPt(y, Math.PI * 0.08)));
  gougeStroke(sctx, starRim, { color: '#BB9AF7', maxWidth: 0.9, alpha: 0.34, taperStart: 0.12, taperEnd: 0.65, wobble: 0.14, rng });

  // ---- D. RECESSED COCKPIT BEZEL & SCRAPED GLASS CATCHLIGHTS ----
  function makeCanopyPoly(yTop, yBot, wMax, zLift) {
    const pts = [];
    for (let i = 0; i <= 16; i++) {
      const t = i / 16, y = yTop - t * (yTop - yBot), s = Math.sin(t * Math.PI);
      pts.push(P(-wMax * s, y, hullRz(y) + zLift * s));
    }
    for (let i = 16; i >= 0; i--) {
      const t = i / 16, y = yTop - t * (yTop - yBot), s = Math.sin(t * Math.PI);
      pts.push(P(wMax * s, y, hullRz(y) + zLift * s));
    }
    return pts;
  }
  fillPoly(sctx, makeCanopyPoly(87, 37, 15.8, 3.0), '#0C0F18');
  const canopyGlass = makeCanopyPoly(84, 40, 13.0, 2.8);
  fillPoly(sctx, canopyGlass, '#102242');

  gougeStroke(sctx, [P(-10.5, 65, hullRz(65) + 2.8), P(-8.2, 74, hullRz(74) + 2.5), P(-2.5, 81, hullRz(81) + 1.5)], {
    color: '#FFFFFF', maxWidth: 2.6, alpha: 0.96, taperStart: 0.22, taperEnd: 0.25, wobble: 0.08, rng
  });
  gougeStroke(sctx, [P(-7.2, 61, hullRz(61) + 3.0), P(-3.8, 72, hullRz(72) + 2.6), P(-1.5, 76, hullRz(76) + 2.0)], {
    color: '#A4E4FF', maxWidth: 1.5, alpha: 0.82, taperStart: 0.25, taperEnd: 0.28, wobble: 0.08, rng
  });
  gougeStroke(sctx, [P(-9.5, 51, hullRz(51) + 2.6), P(-4.0, 58, hullRz(58) + 3.0)], {
    color: '#7DCFFF', maxWidth: 1.6, alpha: 0.78, taperStart: 0.25, taperEnd: 0.25, wobble: 0.08, rng
  });
  gougeStroke(sctx, canopyGlass.slice(0, 17), { color: '#F0FAFF', maxWidth: 1.7, alpha: 0.95, taperStart: 0.1, taperEnd: 0.1, wobble: 0.1, rng });
  gougeStroke(sctx, canopyGlass.slice(17), { color: '#7AA2F7', maxWidth: 0.95, alpha: 0.45, taperStart: 0.2, taperEnd: 0.2, wobble: 0.1, rng });
  gougeStroke(sctx, [P(0, 84, hullRz(84) + 0.5), P(0, 40, hullRz(40) + 0.5)], { color: '#A4E4FF', maxWidth: 0.95, alpha: 0.65, taperStart: 0.1, taperEnd: 0.1, wobble: 0.06, rng });
  gougeStroke(sctx, [P(-12.2, 62, hullRz(62) + 2.5), P(0, 64, hullRz(64) + 4.0), P(12.2, 62, hullRz(62) + 2.5)], { color: '#7DCFFF', maxWidth: 0.95, alpha: 0.60, taperStart: 0.1, taperEnd: 0.1, wobble: 0.06, rng });

  // ---- E. THREE RECESSED 3D ELLIPTICAL ENGINE BELLS ----
  for (const nz of nozzles) {
    const rimFront = [];
    for (let i = 0; i <= 24; i++) {
      const a = (i / 24) * Math.PI * 2;
      rimFront.push(P(nz.cx + Math.cos(a) * nz.r, nz.cy - nz.len, nz.cz + Math.sin(a) * nz.r));
    }
    const casing = [
      P(nz.cx - nz.r * 0.78, nz.cy, nz.cz),
      P(nz.cx - nz.r, nz.cy - nz.len, nz.cz),
      ...rimFront.slice(12, 25),
      P(nz.cx + nz.r * 0.78, nz.cy, nz.cz),
    ];
    fillPoly(sctx, casing, '#0C0F18');
    fillPoly(sctx, rimFront, '#09101E');
    for (let deg = 115; deg <= 235; deg += 24) {
      const a = (deg * Math.PI) / 180;
      gougeStroke(sctx, [
        P(nz.cx + Math.cos(a) * nz.r * 0.78, nz.cy, nz.cz + Math.sin(a) * nz.r * 0.78),
        P(nz.cx + Math.cos(a) * nz.r, nz.cy - nz.len, nz.cz + Math.sin(a) * nz.r),
      ], { color: '#7DCFFF', maxWidth: 0.85, alpha: 0.65, taperStart: 0.15, taperEnd: 0.15, wobble: 0.08, rng });
    }
    const innerGlow = [];
    for (let i = 0; i <= 18; i++) {
      const a = (i / 18) * Math.PI * 2;
      innerGlow.push(P(nz.cx + Math.cos(a) * nz.r * 0.62, nz.cy - nz.len + 1.5, nz.cz + Math.sin(a) * nz.r * 0.62));
    }
    gougeStroke(sctx, innerGlow, { color: '#E2F6FF', maxWidth: 1.2, alpha: 0.84, taperStart: 0.1, taperEnd: 0.1, wobble: 0.08, rng });
    gougeStroke(sctx, rimFront.slice(6, 20), { color: '#A4E4FF', maxWidth: 1.35, alpha: 0.88, taperStart: 0.15, taperEnd: 0.15, wobble: 0.08, rng });
    gougeStroke(sctx, [...rimFront.slice(19, 25), ...rimFront.slice(0, 7)], { color: '#7AA2F7', maxWidth: 0.85, alpha: 0.40, taperStart: 0.2, taperEnd: 0.2, wobble: 0.08, rng });
  }

  // ---- F. DORSAL VERTICAL TAIL STABILIZER ----
  const finRootY0 = -18, finRootY1 = -95, finTopY0 = -58, finTopY1 = -94, finH = 38;
  const finPort = [
    P(-1.5, finRootY0, hullRz(finRootY0)),
    P(-0.8, finTopY0,  hullRz(finTopY0) + finH),
    P(-0.8, finTopY1,  hullRz(finTopY1) + finH - 3),
    P(-1.5, finRootY1, hullRz(finRootY1)),
  ];
  fillPoly(sctx, finPort, '#121E36');
  for (let i = 0; i <= 11; i++) {
    const u = i / 11;
    const z0 = hullRz(finRootY0) + u * (finH - 4);
    const yLead = finRootY0 + u * (finTopY0 - finRootY0);
    const yTrail = finRootY1 + u * (finTopY1 - finRootY1);
    gougeStroke(sctx, [
      P(-1.4 + u * 0.5, yLead, z0),
      P(-1.4 + u * 0.5, yLead + (yTrail - yLead) * (0.62 + 0.30 * rng()), z0),
    ], {
      color: u > 0.55 ? '#E2F6FF' : '#7DCFFF',
      maxWidth: 0.72 + (1 - Math.abs(u - 0.5)) * 0.48, alpha: 0.30 + u * 0.45,
      taperStart: 0.10, taperEnd: 0.58, wobble: 0.12, rng,
    });
  }
  gougeStroke(sctx, [finPort[0], finPort[1]], { color: '#F8FAFC', maxWidth: 2.1, alpha: 0.96, taperStart: 0.08, taperEnd: 0.12, wobble: 0.12, rng });
  gougeStroke(sctx, [finPort[1], finPort[2]], { color: '#A4E4FF', maxWidth: 1.25, alpha: 0.72, taperStart: 0.10, taperEnd: 0.45, wobble: 0.10, rng });
  gougeStroke(sctx, [finPort[2], finPort[3]], { color: '#7AA2F7', maxWidth: 0.75, alpha: 0.28, taperStart: 0.25, taperEnd: 0.55, wobble: 0.10, rng });
  gougeStroke(sctx, [finPort[0], finPort[3]], { color: '#7DCFFF', maxWidth: 1.0, alpha: 0.55, taperStart: 0.12, taperEnd: 0.25, wobble: 0.08, rng });

  // ---- G. SUBTLE 16_2026 source-atop GRAIN ON LIT PORTIONS OF ROCKET ONLY ----
  // Dark grain everywhere on ship (keeps shadow starboard wing dissolved in obsidian!)
  const shipGrainDark = makeGrainPattern(256, 256, 0.042, 0.24, 0.0, 0.0, 991626);
  sctx.save();
  sctx.globalCompositeOperation = 'source-atop';
  sctx.fillStyle = sctx.createPattern(shipGrainDark, 'repeat');
  sctx.fillRect(0, 0, W, H);
  // Subtle bright grain clipped strictly to the sunlit port half (zero dots on dark starboard wing!)
  sctx.beginPath();
  const nose = P(0, 145, 0), tail = P(0, -130, 0);
  const portFar1 = P(-140, 145, 0), portFar2 = P(-140, -130, 0);
  sctx.moveTo(nose[0], nose[1]); sctx.lineTo(tail[0], tail[1]);
  sctx.lineTo(portFar2[0], portFar2[1]); sctx.lineTo(portFar1[0], portFar1[1]);
  sctx.closePath();
  sctx.clip();
  const shipGrainLight = makeGrainPattern(256, 256, 0.0, 0.0, 0.030, 0.18, 991627);
  sctx.fillStyle = sctx.createPattern(shipGrainLight, 'repeat');
  sctx.fillRect(0, 0, W, H);
  sctx.restore();

  // Composite spacecraft layer onto main canvas
  ctx.drawImage(sc, 0, 0, W, H);
}

// -----------------------------------------------------------------------------
// Master Pure Deterministic Render Contract: render(frame, env)
// -----------------------------------------------------------------------------
window.DUR = 1.0;
window.render = function (frame, env) {
  const canvas = document.getElementById('c');
  const dpr = (env && env.scale) || window.devicePixelRatio || 1;
  const W = (env && env.width) || 1280;
  const H = (env && env.height) || 720;
  const transparentBg = !!(env && env.transparent);

  canvas.width = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';

  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  const rng = mulberry32(20261126 + (frame || 0));
  const noise = makeNoise2D(7741);

  const planet = { cx: W * 0.968, cy: H * 1.155, R: H * 0.35 };
  const P = makeShipProjector(W * 0.858, H * 0.640);

  drawBackdrop(ctx, W, H, planet, rng, transparentBg);
  drawGrainyFlatPlanet(ctx, W, H, dpr, planet, rng, noise, transparentBg);
  drawOrbitalChart(ctx, W, H, planet, rng);
  drawSpacecraft3D(ctx, W, H, dpr, P, rng, transparentBg);

  window.__ready = true;
};

const params = new URLSearchParams(location.search);
const sc = parseFloat(params.get('scale') || '1');
const tr = params.get('transparent') === '1';
window.render(0, { width: 1280, height: 720, scale: sc, transparent: tr });
</script>
