[package]
name = "nave-edit"
version = "0.1.0"
edition = "2021"
description = "Fast, zero-TUI-framework, VS Code-keybound Obsidian terminal editor for Nave Terminal"
license = "MIT"

[dependencies]
libc = "0.2"
regex-lite = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
